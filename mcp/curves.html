<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenMagnetics sweeps</title>
    <style>
      /* Roles, not raw hex, so light/dark swap in one place. Palette slots are the
         validated categorical order (dataviz reference palette); both modes are
         SELECTED steps for their own surface, not an automatic flip. */
      .viz-root {
        color-scheme: light;
        --surface-1: #fcfcfb;
        --text-primary: #0b0b0b;
        --text-secondary: #52514e;
        --text-muted: #77766f;
        --grid: #e6e5e1;
        --axis: #c9c8c2;
        --series-1: #2a78d6;
        --series-2: #eb6834;
        --series-3: #1baf7a;
        --series-4: #eda100;
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) .viz-root {
          color-scheme: dark;
          --surface-1: #1a1a19;
          --text-primary: #ffffff;
          --text-secondary: #c3c2b7;
          --text-muted: #8f8e85;
          --grid: #2e2e2c;
          --axis: #464642;
          --series-1: #3987e5;
          --series-2: #d95926;
          --series-3: #199e70;
          --series-4: #c98500;
        }
      }
      :root[data-theme="dark"] .viz-root {
        color-scheme: dark;
        --surface-1: #1a1a19;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #8f8e85;
        --grid: #2e2e2c;
        --axis: #464642;
        --series-1: #3987e5;
        --series-2: #d95926;
        --series-3: #199e70;
        --series-4: #c98500;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }
      .viz-root {
        background: var(--surface-1);
        color: var(--text-primary);
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 14px 16px 16px;
      }
      h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .sub { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
      .note {
        color: var(--text-secondary); font-size: 12px; margin-top: 10px;
        border-left: 2px solid var(--axis); padding-left: 9px;
      }
      .muted { color: var(--text-muted); }
      .chart { position: relative; margin-top: 10px; }
      svg { display: block; width: 100%; height: auto; overflow: visible; }
      .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; }
      .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
            color: var(--text-secondary); }
      .sw { width: 12px; height: 2px; border-radius: 1px; flex: none; }
      .tip {
        position: absolute; pointer-events: none; opacity: 0; transition: opacity .08s;
        background: var(--surface-1); color: var(--text-primary);
        border: 1px solid var(--axis); border-radius: 6px; padding: 6px 8px;
        font-size: 12px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.14);
        z-index: 2;
      }
      .tip .k { color: var(--text-secondary); }
      table { border-collapse: collapse; font-size: 12px; margin-top: 10px; width: 100%; }
      th, td { text-align: right; padding: 2px 8px 2px 0; }
      th { color: var(--text-secondary); font-weight: 500; }
      td { font-variant-numeric: tabular-nums; }
      details { margin-top: 10px; }
      summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app" class="viz-root"></div>
    <script type="module" src="/src/curves.js"></script>
  </body>
</html>
